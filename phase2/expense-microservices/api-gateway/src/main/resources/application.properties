spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost

# Expense Service
spring.cloud.gateway.server.webmvc.routes[0].id=expense-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://expense-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/expenses/**

# Reimbursement Service
spring.cloud.gateway.server.webmvc.routes[1].id=reimbursement-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://reimbursement-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/reimbursements/**